name: Electrical Job Search

on:
  schedule:
    # Covers 7 AM–6 PM Eastern during both EST and EDT.
    # The time check below makes sure only the correct 12 local hours run.
    - cron: "0 11-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Check Eastern time
        id: timecheck
        shell: bash
        run: |
          HOUR=$(TZ=America/New_York date +%H)
          echo "Current Eastern hour: $HOUR"

          if [ "$HOUR" -ge 7 ] && [ "$HOUR" -le 18 ]; then
            echo "run_search=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_search=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.timecheck.outputs.run_search == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.timecheck.outputs.run_search == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.timecheck.outputs.run_search == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          pip install python-jobspy pandas

      - name: Search for electrical jobs
        if: steps.timecheck.outputs.run_search == 'true' || github.event_name == 'workflow_dispatch'
        run: python job_search.py

      - name: Save updated jobs
        if: steps.timecheck.outputs.run_search == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jobs.json

          if git diff --cached --quiet; then
            echo "No changes to jobs.json"
          else
            git commit -m "Update electrical job listings"
            git push
          fi
