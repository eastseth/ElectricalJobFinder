name: Electrical Job Search

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7-18 * * *"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: electrical-job-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Search for electrical jobs
        run: python job_search.py

      - name: Commit updated feed
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json status.json

          if git diff --cached --quiet; then
            echo "No feed changes to commit."
            exit 0
          fi

          git commit -m "Update electrical job listings"
          git push
